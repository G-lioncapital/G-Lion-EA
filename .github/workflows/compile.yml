name: Compile & Send EA to Telegram

on:
  repository_dispatch:
    types: [compile_ea]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install MetaTrader 5
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 30

      - name: Inject Client Credentials into Source Code
        run: |
          $file = "MQL5/Experts/GridLayerEA.mq5"
          $content = Get-Content -Path $file -Raw
          $content = $content -replace 'InpCustomAccount = 0', "InpCustomAccount = ${{ github.event.client_payload.mt5_id }}"
          $content = $content -replace 'InpExpiryDate    = "2026.12.31"', "InpExpiryDate    = `"${{ github.event.client_payload.expiry_date }}`""
          $content = $content -replace 'InpLicenseKey    = "N/A"', "InpLicenseKey    = `"${{ github.event.client_payload.license_key }}`""
          Set-Content -Path $file -Value $content

      - name: Compile EA with MetaEditor
        run: |
          $metaeditor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          & $metaeditor /compile:"MQL5\Experts\GridLayerEA.mq5" /log:"compile.log"
          Get-Content "compile.log"

      - name: Send Compiled .ex5 File to Telegram Bot
        run: |
          curl.exe -s -F document=@"MQL5\Experts\GridLayerEA.ex5" -F chat_id="${{ github.event.client_payload.chat_id }}" -F caption="✅ <b>GridLayerEA Generated</b>%0A%0A🔑 MT5 ID: ${{ github.event.client_payload.mt5_id }}%0A⏳ Expiry: ${{ github.event.client_payload.expiry_date }}%0A🔐 License Key: ${{ github.event.client_payload.license_key }}" -F parse_mode="HTML" https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

name: Compile & Send EA to Telegram

on:
  repository_dispatch:
    types: [compile_ea]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install MetaTrader 5
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 30

      - name: Inject Client Credentials into Source Code
        run: |
          $file = "${{ github.workspace }}\MQL5\Experts\GridLayerEA.mq5"
          $content = Get-Content -Path $file -Raw
          $content = $content -replace 'InpCustomAccount = 0', "InpCustomAccount = ${{ github.event.client_payload.mt5_id }}"
          $content = $content -replace 'InpExpiryDate    = "2026.12.31"', "InpExpiryDate    = `"${{ github.event.client_payload.expiry_date }}`""
          $content = $content -replace 'InpLicenseKey    = "N/A"', "InpLicenseKey    = `"${{ github.event.client_payload.license_key }}`""
          Set-Content -Path $file -Value $content

      - name: Compile EA with MetaEditor
        continue-on-error: true
        run: |
          $metaeditor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $source = "${{ github.workspace }}\MQL5\Experts\GridLayerEA.mq5"
          $log = "${{ github.workspace }}\compile.log"
          Start-Process -FilePath $metaeditor -ArgumentList "/compile:`"$source`" /log:`"$log`"" -Wait

      - name: Send Compiled .ex5 File to Telegram Bot
        shell: pwsh
        run: |
          $ex5 = "${{ github.workspace }}\MQL5\Experts\GridLayerEA.ex5"
          $log = "${{ github.workspace }}\compile.log"
          
          if (-Not (Test-Path $ex5)) {
              Write-Output "❌ ERROR: The compiler failed to generate the .ex5 file!"
              if (Test-Path $log) { Get-Content $log }
              exit 1
          }

          Write-Output "File found! Uploading directly via PowerShell..."
          
          $bot_token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chat_id = "${{ github.event.client_payload.chat_id }}"
          
          # Native PowerShell formatting for the Telegram caption
          $caption = "✅ <b>GridLayerEA Generated</b>`n`n🔑 MT5 ID: ${{ github.event.client_payload.mt5_id }}`n⏳ Expiry: ${{ github.event.client_payload.expiry_date }}`n🔐 License Key: ${{ github.event.client_payload.license_key }}"
          
          $uri = "https://api.telegram.org/bot$bot_token/sendDocument"
          
          # Build the file upload payload
          $form = @{
              chat_id = $chat_id
              caption = $caption
              parse_mode = "HTML"
              document = Get-Item -Path $ex5
          }
          
          try {
              $response = Invoke-RestMethod -Uri $uri -Method Post -Form $form
              Write-Output "✅ Successfully delivered to Telegram!"
              $response | ConvertTo-Json
          } catch {
              Write-Output "❌ Telegram API Error:"
              Write-Output $_.Exception.Message
              if ($_.ErrorDetails) { Write-Output $_.ErrorDetails.Message }
              exit 1
          }

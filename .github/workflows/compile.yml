name: Compile & Send EA to Telegram

on:
  repository_dispatch:
    types: [compile_ea]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install MetaTrader 5
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 30

      - name: Inject Client Credentials into Source Code
        run: |
          $file = "${{ github.workspace }}\MQL5\Experts\GridLayerEA.mq5"
          $content = Get-Content -Path $file -Raw
          $content = $content -replace 'InpCustomAccount = 0', "InpCustomAccount = ${{ github.event.client_payload.mt5_id }}"
          $content = $content -replace 'InpExpiryDate    = "2026.12.31"', "InpExpiryDate    = `"${{ github.event.client_payload.expiry_date }}`""
          $content = $content -replace 'InpLicenseKey    = "N/A"', "InpLicenseKey    = `"${{ github.event.client_payload.license_key }}`""
          Set-Content -Path $file -Value $content

      - name: Compile EA inside Official MT5 Directory
        run: |
          $metaeditor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $mt5_mql5 = "C:\Program Files\MetaTrader 5\MQL5\Experts"
          
          # Ensure standard path exists and copy our EA there
          New-Item -ItemType Directory -Force -Path $mt5_mql5
          Copy-Item -Path "${{ github.workspace }}\MQL5\Experts\GridLayerEA.mq5" -Destination "$mt5_mql5\GridLayerEA.mq5" -Force
          
          $source = "$mt5_mql5\GridLayerEA.mq5"
          $log = "$mt5_mql5\compile.log"
          
          # Compile
          Start-Process -FilePath $metaeditor -ArgumentList "/compile:`"$source`" /log:`"$log`"" -Wait
          
          # Print log to help debug if it fails again
          if (Test-Path $log) { Get-Content $log }
          
          # Bring compiled file back to workspace
          if (Test-Path "$mt5_mql5\GridLayerEA.ex5") {
            Copy-Item -Path "$mt5_mql5\GridLayerEA.ex5" -Destination "${{ github.workspace }}\MQL5\Experts\GridLayerEA.ex5" -Force
          }

      - name: Send Compiled .ex5 File to Telegram Bot
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MT5_ID: ${{ github.event.client_payload.mt5_id }}
          EXPIRY: ${{ github.event.client_payload.expiry_date }}
          LICENSE: ${{ github.event.client_payload.license_key }}
        run: |
          EX5_PATH="${{ github.workspace }}/MQL5/Experts/GridLayerEA.ex5"
          
          # Check if the file actually compiled
          if [ ! -f "$EX5_PATH" ]; then
            echo "ERROR: The .ex5 file was not found! The compiler failed to generate it."
            exit 1
          fi

          # Format the Telegram caption
          CAPTION=$(printf "✅ <b>GridLayerEA Generated</b>\n\n🔑 MT5 ID: %s\n⏳ Expiry: %s\n🔐 License Key: %s" "$MT5_ID" "$EXPIRY" "$LICENSE")
          
          # Send the file securely via Telegram API
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${EX5_PATH}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
